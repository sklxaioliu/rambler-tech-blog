<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img"><rect width="1100" height="420" rx="24" fill="#151c2d"/><text x="42" y="59" fill="#f5f1ff" font-size="29" font-family="Microsoft YaHei, sans-serif" font-weight="700">条件筛选、逻辑组合与排序</text><rect x="40" y="110" width="304" height="205" rx="16" fill="#242e46" stroke="#77669a"/><text x="58" y="153" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#b7e4de">部门 10 或 20</text><text x="58" y="206" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#ded8f1">IN (10,20)</text><text x="58" y="245" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#ded8f1">框内是 OR 关系</text><path d="M 351 215 h 31 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#c9b4ff" stroke-width="3"/><rect x="397" y="110" width="304" height="205" rx="16" fill="#242e46" stroke="#77669a"/><text x="415" y="153" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#b7e4de">并且工资至少 8000</text><text x="415" y="206" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#ded8f1">AND salary &gt;= 8000</text><text x="415" y="245" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#ded8f1">两个条件同时满足</text><path d="M 708 215 h 31 l -8 -7 m 8 7 l -8 7" fill="none" stroke="#c9b4ff" stroke-width="3"/><rect x="754" y="110" width="304" height="205" rx="16" fill="#242e46" stroke="#77669a"/><text x="772" y="153" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#b7e4de">按工资与编号排序</text><text x="772" y="206" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#ded8f1">工资降序，编号升序</text><text x="772" y="245" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#ded8f1">并列时顺序仍明确</text><text x="43" y="375" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#a8acc0">个人技术知识库 · MySQL 知识图解 · 按业务含义逐步理解</text></svg>