<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect width="1100" height="590" rx="20" fill="#151c2d"/><text x="35" y="52" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#e9e5f5">自连接：同一张表里的员工与经理</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b9a0f1"/></marker></defs><text x="40" y="104" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#e9e5f5">别名 e：站在员工的角色看</text><text x="660" y="104" font-family="Microsoft YaHei,sans-serif" font-size="24" fill="#e9e5f5">别名 m：站在经理的角色看</text><rect x="40" y="130" width="225" height="48" fill="#3e4763"/><text x="50" y="162" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">姓名</text><rect x="265" y="130" width="225" height="48" fill="#3e4763"/><text x="275" y="162" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">manager_id</text><rect x="40" y="178" width="225" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="50" y="210" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">林经理</text><rect x="265" y="178" width="225" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="275" y="210" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">NULL</text><rect x="40" y="226" width="225" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="50" y="258" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">陈工程</text><rect x="265" y="226" width="225" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="275" y="258" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">1</text><rect x="40" y="274" width="225" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="50" y="306" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">王销售</text><rect x="265" y="274" width="225" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="275" y="306" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">1</text><rect x="660" y="130" width="195" height="48" fill="#3e4763"/><text x="670" y="162" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">employee_id</text><rect x="855" y="130" width="195" height="48" fill="#3e4763"/><text x="865" y="162" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">姓名</text><rect x="660" y="178" width="195" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="670" y="210" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">1</text><rect x="855" y="178" width="195" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="865" y="210" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">林经理</text><rect x="660" y="226" width="195" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="670" y="258" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">2</text><rect x="855" y="226" width="195" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="865" y="258" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">陈工程</text><rect x="660" y="274" width="195" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="670" y="306" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">3</text><rect x="855" y="274" width="195" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="865" y="306" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">王销售</text><path d="M495 250 L650 202" fill="none" stroke="#b9a0f1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M495 298 L650 202" fill="none" stroke="#b9a0f1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="410" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#b7e4de">e.manager_id = m.employee_id</text><text x="40" y="465" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#e9e5f5">陈工程的经理编号是 1，因此找到林经理这一行。</text><text x="40" y="515" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#e9e5f5">使用 LEFT JOIN，还可以保留没有经理的林经理。</text></svg>