<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" rx="20" fill="#151c2d"/><text x="35" y="52" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#e9e5f5">事务时间线：先看谁提交，再看读取类型</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b9a0f1"/></marker></defs><text x="45" y="105" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#aeb5ca">时间向下</text><rect x="40" y="135" width="336.6666666666667" height="48" fill="#3e4763"/><text x="50" y="167" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">时点</text><rect x="376.6666666666667" y="135" width="336.6666666666667" height="48" fill="#3e4763"/><text x="386.6666666666667" y="167" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">连接 A</text><rect x="713.3333333333334" y="135" width="336.6666666666667" height="48" fill="#3e4763"/><text x="723.3333333333334" y="167" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">连接 B</text><rect x="40" y="183" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="50" y="215" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">1</text><rect x="376.6666666666667" y="183" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="386.6666666666667" y="215" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">开启事务，读取 1000</text><rect x="713.3333333333334" y="183" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="723.3333333333334" y="215" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">尚未修改</text><rect x="40" y="231" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="50" y="263" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">2</text><rect x="376.6666666666667" y="231" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="386.6666666666667" y="263" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">事务仍在进行</text><rect x="713.3333333333334" y="231" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="723.3333333333334" y="263" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">修改为 900，未提交</text><rect x="40" y="279" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="50" y="311" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">3</text><rect x="376.6666666666667" y="279" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="386.6666666666667" y="311" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">此时需区分隔离级别</text><rect x="713.3333333333334" y="279" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="723.3333333333334" y="311" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">COMMIT 提交 900</text><rect x="40" y="327" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="50" y="359" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">4</text><rect x="376.6666666666667" y="327" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="386.6666666666667" y="359" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">再次普通 SELECT</text><rect x="713.3333333333334" y="327" width="336.6666666666667" height="48" fill="#232e46" stroke="#6d718a" stroke-width="1"/><text x="723.3333333333334" y="359" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#e9e5f5">事务已结束</text><text x="45" y="430" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#a3dfcd">脏读：关注是否读到未提交值。</text><text x="45" y="477" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#e9e5f5">不可重复读：同一事务前后读同一行，值发生变化。</text><text x="45" y="524" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#e9e5f5">RC 的后一次一致性读可见已提交的新值；RR 按快照解释。</text><text x="45" y="575" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#b7b0c9">锁定读与普通快照读不同，不能混用一个结论。</text></svg>