<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>移动端布局验收</title><style>body{background:#dfe8e8;margin:20px;font:14px sans-serif}iframe{width:390px;height:844px;border:0;border-radius:20px;box-shadow:0 5px 30px #1233}h1{font-size:18px}main{display:flex;gap:24px}</style></head><body><h1>390 × 844 CSS 像素 / 真实页面 iframe 布局检查（非手机真机测试）</h1><p id="metrics"></p><main><iframe title="手机首页" src="/"></iframe><iframe title="手机文章" src="/posts/sql-joins/"></iframe></main><script>for(const frame of document.querySelectorAll('iframe'))frame.addEventListener('load',()=>{setTimeout(()=>{const d=frame.contentDocument;document.querySelector('#metrics').textContent+=frame.title+': viewport='+frame.contentWindow.innerWidth+', scrollWidth='+d.documentElement.scrollWidth+'; ';},500)});</script></body></html>
