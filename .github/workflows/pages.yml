name: Publish blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Expand initial source archive
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p tmp/import
          unzip -q blog-source.zip -d tmp/import
          rsync -a --exclude='.github' --exclude='.git' tmp/import/ ./
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Expand verified blog source for normal maintenance'
          git push
      # 网页上传的一次性内容更新；文章已存在时跳过，避免覆盖后续维护。
      - name: Import verified Codex tutorial update
        if: hashFiles('source/_posts/codex-windows-guide.md') == '' && hashFiles('codex-tutorial-update.zip') != ''
        run: |
          echo 'e42509bb909ea980a4ab64834c84c6a0fe6c5434696d2fa769a07dddc1ef9a5e  codex-tutorial-update.zip' | sha256sum --check
          unzip -oq codex-tutorial-update.zip
          git add source/_posts/codex-windows-guide.md source/_data/learning.yml source/img/ai-tools.svg source/guide/index.md _config.yml tools/http-check.cjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish detailed Codex installation and usage guide'
          git push
      - name: Import verified work experience articles
        if: (hashFiles('source/_posts/jushuitan-internship.md') == '' || hashFiles('source/_posts/youceng-industrial-vision.md') == '') && hashFiles('work-experience-update.zip') != ''
        run: |
          echo 'c7edb5176057973ba8baa081b0402018362fd03a0317cd0cc2dbcd8cb942aaf2  work-experience-update.zip' | sha256sum --check
          unzip -oq work-experience-update.zip
          git add source/_posts/jushuitan-internship.md source/_posts/youceng-industrial-vision.md source/_data/learning.yml source/img/work-experience.svg source/img/work/jushuitan-day.jpg source/img/work/youceng-site.jpg source/guide/index.md _config.yml tools/verify.cjs tools/update-learning.cjs source/css/portal.css layouts/portal.pug docs/ASSETS.md docs/WORK-EXPERIENCE-2026-10-23.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish Jushuitan and Youceng work experience articles'
          git push
      - name: Import complete work photo galleries
        if: hashFiles('docs/WORK-PHOTO-GALLERY-2026-10-23.md') == '' && hashFiles('work-gallery-update.zip') != ''
        run: |
          echo '224ecd8adf6f02629a4057a5ae88fb89d85aab85783723fa1cf9db8bdf997414  work-gallery-update.zip' | sha256sum --check
          unzip -oq work-gallery-update.zip
          python3 -m venv /tmp/rambler-photo-import
          /tmp/rambler-photo-import/bin/pip --disable-pip-version-check install 'Pillow==12.3.0'
          /tmp/rambler-photo-import/bin/python tools/import-work-photos.py
          git add source/_posts/jushuitan-internship.md source/_posts/youceng-industrial-vision.md source/_data/work-galleries.json source/img/work/gallery source/css/interior.css tools/verify.cjs tools/update-work-galleries.cjs tools/import-work-photos.py docs/ASSETS.md docs/WORK-EXPERIENCE-2026-10-23.md docs/WORK-PHOTO-GALLERY-2026-10-23.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore 49 work photos with individual captions'
          git push
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm run verify:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

