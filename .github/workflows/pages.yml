name: Publish blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Expand initial source archive
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p tmp/import
          unzip -q blog-source.zip -d tmp/import
          rsync -a --exclude='.github' --exclude='.git' tmp/import/ ./
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Expand verified blog source for normal maintenance'
          git push
      # 网页上传的一次性内容更新；文章已存在时跳过，避免覆盖后续维护。
      - name: Import verified Codex tutorial update
        if: hashFiles('source/_posts/codex-windows-guide.md') == '' && hashFiles('codex-tutorial-update.zip') != ''
        run: |
          echo 'e42509bb909ea980a4ab64834c84c6a0fe6c5434696d2fa769a07dddc1ef9a5e  codex-tutorial-update.zip' | sha256sum --check
          unzip -oq codex-tutorial-update.zip
          git add source/_posts/codex-windows-guide.md source/_data/learning.yml source/img/ai-tools.svg source/guide/index.md _config.yml tools/http-check.cjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish detailed Codex installation and usage guide'
          git push
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm run verify:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

